# Blueprint gratuito para la primera version de AYC API.
# Celery, Redis y beat se activan en un Blueprint separado cuando haya presupuesto.

services:
  - type: web
    name: ayc-api-web
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: ayc-free
      - key: DATABASE_URL
        fromDatabase:
          name: ayc-api-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "1"
      - key: BOOTSTRAP_ADMIN_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://aycsoluciones.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://aycsoluciones.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://aycsoluciones.vercel.app
      - key: AUTH_COOKIE_SAMESITE
        value: "None"
      - key: AUTH_COOKIE_SECURE
        value: "1"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "1"
      - key: CLOUDINARY_CLOUD_NAME
        value: duyneiyve
      - key: CLOUDINARY_LOGO_PUBLIC_ID
        value: soluciones_1_xkf6ad

databases:
  - name: ayc-api-db
    region: ohio
    plan: free
    postgresMajorVersion: "16"

envVarGroups:
  - name: ayc-free
    envVars:
      - key: DEBUG
        value: "0"
      - key: CELERY_ENABLED
        value: "0"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: PUSHER_ENABLED
        value: "0"
