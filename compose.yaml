name: ayc-api

x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env.docker}
  DEBUG: ${DEBUG:-0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  URL_DB: postgresql://${POSTGRES_USER:-ayc_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}@db:5432/${POSTGRES_DB:-ayc_db}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-25}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
  EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-0}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
  PORT: 8000
  CELERY_ENABLED: ${CELERY_ENABLED:-1}
  PUSHER_ENABLED: ${PUSHER_ENABLED:-0}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayc_db}
      POSTGRES_USER: ${POSTGRES_USER:-ayc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "ayc_api", "worker", "--loglevel=info"]
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "ayc_api", "beat", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
      - media:/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
