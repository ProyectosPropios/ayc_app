# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow helps you trigger a SonarCloud analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# Free for open source project.

# 1. Login to SonarCloud.io using your GitHub account

# 2. Import your project on SonarCloud
#     * Add your GitHub organization first, then add your repository as a new project.
#     * Please note that many languages are eligible for automatic analysis,
#       which means that the analysis will start automatically without the need to set up GitHub Actions.
#     * This behavior can be changed in Administration > Analysis Method.
#
# 3. Follow the SonarCloud in-product tutorial
#     * a. Copy/paste the Project Key and the Organization Key into the args parameter below
#          (You'll find this information in SonarCloud. Click on "Information" at the bottom left)
#
#     * b. Generate a new token and add it to your Github repository's secrets using the name SONAR_TOKEN
#          (On SonarCloud, click on your avatar on top-right > My account > Security
#           or go directly to https://sonarcloud.io/account/security/)

# Feel free to take a look at our documentation (https://docs.sonarcloud.io/getting-started/github/)
# or reach out to our community forum if you need some help (https://community.sonarsource.com/c/help/sc/9)

name: SonarCloud analysis

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarCloud token
        shell: bash
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN está configurado"
          else
            echo "SONAR_TOKEN está VACÍO"
            exit 1
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build test image
        run: docker build --tag ayc-api:sonar .

      - name: Generate Python coverage
        run: |
          mkdir -p coverage
          docker run --rm --user root \
            -v "${{ github.workspace }}/coverage:/coverage" \
            -e DEBUG=0 \
            -e SECURE_SSL_REDIRECT=0 \
            -e SECURE_HSTS_SECONDS=0 \
            -e SECRET_KEY=ci-only-secret-key-for-tests-32-bytes \
            -e URL_DB=sqlite:////tmp/ayc-ci.sqlite3 \
            -e EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend \
            -e EMAIL_DELIVERY_ENABLED=1 \
            -e PUSHER_ENABLED=0 \
            ayc-api:sonar \
            sh -c "python manage.py check && coverage run --rcfile=.coveragerc manage.py test && coverage xml --rcfile=.coveragerc -o /coverage/coverage.xml"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ProyectosPropios_ayc_app
            -Dsonar.organization=proyectospropios
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage/coverage.xml
