name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag ayc-api:test .

      - name: Run Django checks and tests
        run: >-
          docker run --rm
          -e DEBUG=0
          -e SECRET_KEY=ci-only-secret-key-for-tests-32-bytes
          -e URL_DB=sqlite:////tmp/ayc-ci.sqlite3
          -e PUSHER_ENABLED=0
          ayc-api:test
          sh -c "python manage.py check && python manage.py test"
