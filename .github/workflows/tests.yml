name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag ayc-api:test .

      - name: Run Django checks, tests and coverage
        run: |
          mkdir -p coverage
          docker run --rm --user root \
            -v "${{ github.workspace }}/coverage:/coverage" \
            -e DEBUG=0 \
            -e SECURE_SSL_REDIRECT=0 \
            -e SECURE_HSTS_SECONDS=0 \
            -e SECRET_KEY=ci-only-secret-key-for-tests-32-bytes \
            -e URL_DB=sqlite:////tmp/ayc-ci.sqlite3 \
            -e EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend \
            -e EMAIL_DELIVERY_ENABLED=1 \
            -e PUSHER_ENABLED=0 \
            ayc-api:test \
            sh -c "python manage.py check && coverage run --rcfile=.coveragerc manage.py test && coverage xml --rcfile=.coveragerc -o /coverage/coverage.xml"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage/coverage.xml
