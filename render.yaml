# Blueprint gratuito para la primera version de AYC API.
# Celery, Redis y beat se activan en un Blueprint separado cuando haya presupuesto.

services:
  - type: web
    name: ayc-api-web
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: ayc-free
      - key: DATABASE_URL
        fromDatabase:
          name: ayc-api-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "1"
      - key: BOOTSTRAP_ADMIN_TOKEN
        sync: false

databases:
  - name: ayc-api-db
    region: ohio
    plan: free
    postgresMajorVersion: "16"

envVarGroups:
  - name: ayc-free
    envVars:
      - key: DEBUG
        value: "0"
      - key: CELERY_ENABLED
        value: "0"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: PUSHER_ENABLED
        value: "0"
